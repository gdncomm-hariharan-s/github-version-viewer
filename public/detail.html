<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Version History</title>
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
  body { @apply bg-gray-100 text-gray-900; }
  .card { @apply bg-white rounded-xl shadow border border-gray-200; }
  .alert-error { @apply rounded-lg px-3 py-2 text-sm bg-red-50 text-red-700; }
  .version-pill { @apply inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700 border border-gray-200; font-variant-numeric: tabular-nums; }
  tr.current td { @apply bg-emerald-50; }
  tr.current .version-pill { @apply bg-emerald-100 text-emerald-800 border-emerald-300; }
  .build-pill { @apply inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border; }
  .build-success { @apply bg-emerald-100 text-emerald-800 border-emerald-300; }
  .build-failure, .build-error { @apply bg-red-100 text-red-700 border-red-300; }
  .build-pending { @apply bg-amber-100 text-amber-800 border-amber-300; }
  .build-unknown { @apply bg-gray-100 text-gray-500 border-gray-200; }
  .spinner { width: 14px; height: 14px; border: 2px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 9999px; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="min-h-screen">
  <div class="flex items-center justify-between border-b border-gray-200 bg-white shadow-sm px-6 md:px-10 py-3">
    <h1 id="title" class="text-xl font-bold">Version history</h1>
    <a class="text-sm font-semibold text-gray-600 hover:bg-gray-100 px-3 py-1.5 rounded-md" href="index.html">&larr; Back to comparison</a>
  </div>

  <div class="max-w-[900px] mx-auto p-6 md:p-10 space-y-4">
    <p id="subtitle" class="text-xs text-gray-500 -mt-2 font-mono"></p>
    <div id="status" class="flex items-center gap-2 text-sm text-gray-500">
      <span class="spinner"></span> Loading...
    </div>
    <div class="card overflow-hidden">
      <div class="overflow-x-auto">
        <table id="result-table" class="w-full text-sm hidden">
          <thead>
            <tr class="bg-gray-50 border-b-2 border-gray-200">
              <th class="uppercase text-xs tracking-wide text-gray-500 font-semibold text-left px-4 py-3">Version</th>
              <th class="uppercase text-xs tracking-wide text-gray-500 font-semibold text-left px-4 py-3">Changed</th>
              <th class="uppercase text-xs tracking-wide text-gray-500 font-semibold text-left px-4 py-3">Author</th>
              <th class="uppercase text-xs tracking-wide text-gray-500 font-semibold text-left px-4 py-3">Commit</th>
              <th class="uppercase text-xs tracking-wide text-gray-500 font-semibold text-left px-4 py-3">Jenkins</th>
            </tr>
          </thead>
          <tbody id="result-body" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const repo = params.get('repo');
const branch = params.get('branch');
const path = params.get('path');
const service = params.get('service');
const label = params.get('label');
const currentVersion = params.get('version');

document.getElementById('title').textContent = `${service || repo} — ${label || ''}`;
document.getElementById('subtitle').textContent = `${repo} @ ${branch} — ${path}`;

const statusEl = document.getElementById('status');
const table = document.getElementById('result-table');
const tbody = document.getElementById('result-body');

function fmtDate(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleString();
}

const BUILD_TEXT = { success: 'Passed', failure: 'Failed', error: 'Error', pending: 'Building…', unknown: 'No status' };

function buildPill(build) {
  const state = build?.state || 'unknown';
  const text = BUILD_TEXT[state] || state;
  const cls = `build-pill build-${state}`;
  const spinner = state === 'pending' ? '<span class="spinner"></span>' : '';
  if (build?.targetUrl) {
    return `<a class="${cls} hover:opacity-80" href="${build.targetUrl}" target="_blank" rel="noopener">${spinner}${text}</a>`;
  }
  return `<span class="${cls}">${spinner}${text}</span>`;
}

async function load() {
  if (!repo || !branch || !path) {
    statusEl.innerHTML = '<div class="alert-error">Missing repo/branch/path in URL.</div>';
    return;
  }
  try {
    const res = await fetch(
      `/api/file-history?repo=${encodeURIComponent(repo)}&branch=${encodeURIComponent(
        branch
      )}&path=${encodeURIComponent(path)}`
    );
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');

    tbody.innerHTML = '';
    data.history.forEach((h) => {
      const tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50';
      if (currentVersion && h.version === currentVersion) tr.classList.add('current');
      tr.innerHTML = `
        <td class="px-4 py-3 whitespace-nowrap"><span class="version-pill">${h.version || '-'}</span></td>
        <td class="px-4 py-3 whitespace-nowrap">${fmtDate(h.date)}</td>
        <td class="px-4 py-3 whitespace-nowrap">${h.author}</td>
        <td class="px-4 py-3"><a class="text-indigo-600 hover:underline font-semibold" href="${h.htmlUrl}" target="_blank" rel="noopener">${h.shortSha}</a> <span class="text-gray-500 text-xs">${h.message}</span></td>
        <td class="px-4 py-3 whitespace-nowrap">${buildPill(h.build)}</td>
      `;
      tbody.appendChild(tr);
    });
    table.classList.remove('hidden');
    statusEl.textContent = data.history.length
      ? `Showing last ${data.history.length} commits touching this file.`
      : 'No commit history found for this file.';
  } catch (err) {
    statusEl.innerHTML = `<div class="alert-error">Error: ${err.message}</div>`;
  }
}

load();
</script>
</body>
</html>
