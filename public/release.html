<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Release PR Summary</title>
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
  body { @apply bg-gray-100 text-gray-900; }
  .card { @apply bg-white rounded-xl shadow border border-gray-200; }
  .pill { @apply inline-flex items-center px-3 py-1 rounded-full text-xs font-bold uppercase; }
  .pr-label.static { @apply bg-indigo-100 text-indigo-700 border border-indigo-300; }
  .pr-label.canary { @apply bg-amber-100 text-amber-800 border border-amber-300; }
  .pr-label.non-canary { @apply bg-emerald-100 text-emerald-800 border border-emerald-300; }
  .alert-error { @apply rounded-lg px-3 py-2 text-sm bg-red-50 text-red-700; }
  .btn { @apply inline-flex items-center gap-1.5 px-4 py-1.5 text-sm font-semibold transition; }
  .btn-primary { @apply bg-indigo-600 text-white hover:bg-indigo-700; }
  .btn-plain { @apply border border-gray-300 text-gray-600 hover:bg-gray-50; }
  .spinner { width: 14px; height: 14px; border: 2px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 9999px; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="min-h-screen">
  <div class="flex items-center justify-between border-b border-gray-200 bg-white shadow-sm px-6 md:px-10 py-3">
    <h1 class="text-xl font-bold tracking-tight">Release PR Summary</h1>
    <a class="btn btn-plain rounded-md" href="index.html">&larr; Back to comparison</a>
  </div>

  <div class="max-w-[1000px] mx-auto p-6 md:p-10 space-y-4">
    <div id="status" class="flex items-center gap-2 text-sm text-gray-500">
      <span class="spinner"></span> Loading open PRs across dgp-deployment repos...
    </div>
    <button id="copy-all" class="btn btn-primary rounded-full hidden">Copy formatted list</button>
    <div id="cards"></div>
  </div>

<script>
const statusEl = document.getElementById('status');
const cards = document.getElementById('cards');
const copyAllBtn = document.getElementById('copy-all');
let formattedList = '';

const LABEL_TEXT = { static: 'Static', canary: 'canary', 'non-canary': 'Non-canary' };
const LABEL_ORDER = { static: 0, 'non-canary': 1, canary: 2 };

function friendlyServiceName(service) {
  return service.replace(/^gdn-/, '');
}

function buildFormattedList(results) {
  return results
    .map((r) => {
      const prs = [...r.prs]
        .filter((pr) => !pr.automated)
        .sort((a, b) => (LABEL_ORDER[a.label] ?? 9) - (LABEL_ORDER[b.label] ?? 9));
      if (prs.length === 0) return null;
      const lines = prs.map((pr) => `${LABEL_TEXT[pr.label] || pr.label}: ${pr.url}`);
      return `${friendlyServiceName(r.service)}:\n${lines.join('\n')}`;
    })
    .filter(Boolean)
    .join('\n\n');
}

function fmtDate(iso) {
  return new Date(iso).toLocaleString();
}

async function copyText(text, btn, revertLabel) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const original = btn.textContent;
  btn.textContent = 'Copied!';
  btn.classList.add('bg-emerald-100', 'text-emerald-800');
  setTimeout(() => {
    btn.textContent = revertLabel || original;
    btn.classList.remove('bg-emerald-100', 'text-emerald-800');
  }, 1500);
}

cards.addEventListener('click', (e) => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  copyText(btn.dataset.url, btn, 'Copy');
});

copyAllBtn.addEventListener('click', () => {
  copyText(formattedList, copyAllBtn, 'Copy formatted list');
});

async function load() {
  try {
    const res = await fetch('/api/release-prs');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');

    cards.innerHTML = '';
    data.results.forEach((r) => {
      const card = document.createElement('div');
      card.className = 'card p-5 mb-4';
      const crfHtml = r.crf
        ? `<div class="mb-2"><a class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-700 border border-indigo-300" href="https://gdncomm.atlassian.net/browse/${r.crf}" target="_blank" rel="noopener">${r.crf}</a></div>`
        : '';
      const prsSorted = [...r.prs].sort((a, b) => (LABEL_ORDER[a.label] ?? 9) - (LABEL_ORDER[b.label] ?? 9));
      const prRows = prsSorted
        .map(
          (pr) => `
        <div class="flex flex-wrap items-center gap-3 py-2 border-t border-gray-200 first:border-t-0 first:pt-0">
          <span class="pill pr-label ${pr.label} min-w-[84px] justify-center">${pr.label}</span>
          <a class="font-semibold text-gray-900 hover:underline" href="${pr.url}" target="_blank" rel="noopener">${pr.repo.replace('gdncomm/', '')}#${pr.number}</a>
          <button class="text-xs font-semibold text-gray-500 border border-gray-300 rounded-md px-2 py-0.5 hover:bg-gray-100 copy-btn" data-url="${pr.url}">Copy</button>
          <span class="text-xs text-gray-500">${pr.title} &middot; ${pr.author} &middot; ${fmtDate(pr.createdAt)}</span>
          ${pr.automated ? '<span class="pill bg-red-100 text-red-700 border border-red-300">AUTOMATED &mdash; not a release PR</span>' : ''}
        </div>`
        )
        .join('');
      card.innerHTML = `<h2 class="font-bold text-lg mb-1">${r.service}</h2>${crfHtml}${prRows}`;
      cards.appendChild(card);
    });

    formattedList = buildFormattedList(data.results);
    copyAllBtn.classList.toggle('hidden', !formattedList || data.results.length === 0);

    statusEl.textContent = `${data.results.length} services with open release PRs.`;
  } catch (err) {
    statusEl.innerHTML = `<div class="alert-error">Error: ${err.message}</div>`;
  }
}

load();
</script>
</body>
</html>
